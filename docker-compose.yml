services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mobiliza:${POSTGRES_PASSWORD}@db:5432/mobiliza
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
    volumes:
      - mobiliza_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobiliza
      POSTGRES_USER: mobiliza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mobiliza_db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobiliza -d mobiliza"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
volumes:
  mobiliza_db:
  mobiliza_uploads:
